target-version = "py310"
line-length = 100
extend-exclude = ["build", "*.egg-info"]

[lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # line length handled by formatter

[lint.per-file-ignores]
"tests/*" = ["S101"]  # allow assert in tests

[format]
quote-style = "double"
indent-style = "space"
